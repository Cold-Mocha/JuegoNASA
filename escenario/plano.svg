<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Fredoka, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Plano de la Estación Central v2 (vista cenital, no a escala)</title>
  <rect width="1000" height="720" fill="#18144e"/>
  <g fill="#68668f" opacity=".6">
    <circle cx="40" cy="40" r="1.5"/><circle cx="210" cy="90" r="1"/><circle cx="120" cy="230" r="1.5"/><circle cx="960" cy="280" r="1"/><circle cx="980" cy="680" r="1.5"/><circle cx="30" cy="690" r="1"/>
  </g>
  <!-- Módulo integrado (habitacional) -->
  <g>
    <rect x="290" y="50" width="680" height="190" rx="95" fill="#f5f5f2" stroke="#0e0b33" stroke-width="5"/>
    <rect x="340" y="80" width="580" height="130" rx="18" fill="#241d6b"/>
    <rect x="340" y="80" width="110" height="130" rx="14" fill="#5a4a7a"/>
    <rect x="455" y="80" width="95" height="130" rx="10" fill="#21386a"/>
    <rect x="555" y="80" width="215" height="130" rx="10" fill="#33285f"/>
    <rect x="775" y="80" width="145" height="130" rx="14" fill="#2a2378"/>
    <g fill="#f5f5f2" font-size="15" font-weight="600" text-anchor="middle">
      <text x="395" y="140">Soporte</text><text x="395" y="158">vital</text>
      <text x="502" y="148">Enfermería</text>
      <text x="662" y="148">Comunicaciones</text>
      <text x="847" y="140">Refugio</text><text x="847" y="158" font-size="12" fill="#c4c2e0">tormenta solar</text>
    </g>
    <text x="630" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#ffcb47">MÓDULO HABITACIONAL</text>
  </g>
  <!-- Invernadero 1 -->
  <g>
    <rect x="40" y="320" width="400" height="360" rx="70" fill="#f5f5f2" stroke="#0e0b33" stroke-width="5"/>
    <rect x="75" y="350" width="330" height="140" rx="14" fill="#1f3d5a"/>
    <rect x="75" y="500" width="330" height="150" rx="14" fill="#23465f"/>
    <g fill="#5ad6b2">
      <rect x="95" y="372" width="70" height="22" rx="6"/><rect x="180" y="372" width="70" height="22" rx="6"/><rect x="265" y="372" width="70" height="22" rx="6"/>
      
    </g>
    <g fill="#f5f5f2" font-size="15" font-weight="600" text-anchor="middle"><text x="240" y="440">Cultivo de algas</text><text x="240" y="600" fill="#c4c2e0">Huerto (solo decoración)</text></g>
    <text x="240" y="708" text-anchor="middle" font-size="16" font-weight="700" fill="#5ad6b2">INVERNADERO</text>
  </g>
  <!-- Invernadero 2 -->
  <g>
    <rect x="560" y="320" width="400" height="360" rx="70" fill="#f5f5f2" stroke="#0e0b33" stroke-width="5"/>
    <rect x="595" y="350" width="330" height="140" rx="14" fill="#1f3d5a"/>
    <rect x="595" y="500" width="330" height="150" rx="14" fill="#2f2a5c"/>
    <g fill="#9b7bff"><rect x="690" y="372" width="140" height="26" rx="8"/></g>
    <g fill="#ffcb47"><rect x="690" y="522" width="26" height="40" rx="6"/><rect x="726" y="522" width="26" height="40" rx="6"/><rect x="762" y="522" width="26" height="40" rx="6"/></g>
    <g fill="#f5f5f2" font-size="15" font-weight="600" text-anchor="middle"><text x="760" y="440">Puente</text><text x="760" y="600">Energía</text></g>
    <text x="760" y="708" text-anchor="middle" font-size="16" font-weight="700" fill="#5ad6b2">MÓDULO DE MANDO</text>
  </g>
  <!-- Añadido para el juego: Nodo central + Esclusa -->
  <g stroke-dasharray="10 7">
    <path d="M500 240 V300" stroke="#8a87c4" stroke-width="22" stroke-dasharray="none"/>
    <path d="M440 330 H460 M540 330 H560" stroke="#8a87c4" stroke-width="22" stroke-dasharray="none"/>
    <circle cx="500" cy="330" r="48" fill="#322a8a" stroke="#ffcb47" stroke-width="4"/>
    <rect x="465" y="420" width="70" height="80" rx="16" fill="#2a2560" stroke="#ffcb47" stroke-width="4"/>
    <path d="M500 378 V420" stroke="#8a87c4" stroke-width="16" stroke-dasharray="none"/>
  </g>
  <g fill="#f5f5f2" font-size="13" font-weight="600" text-anchor="middle">
    <text x="500" y="326">Nodo</text><text x="500" y="342" font-size="11" fill="#c4c2e0">pasillo</text>
    <text x="500" y="458">Esclusa</text><text x="500" y="474" font-size="11" fill="#c4c2e0">salidas</text>
  </g>
  <!-- Leyenda -->
  <g font-size="12" fill="#c4c2e0">
    <rect x="40" y="40" width="200" height="104" rx="12" fill="#0e0b33" stroke="#8a87c4" stroke-width="2"/>
    <text x="56" y="64" font-weight="600" fill="#f5f5f2">Leyenda</text>
    <rect x="56" y="76" width="16" height="10" rx="3" fill="#f5f5f2"/><text x="80" y="86">Módulo (basado en la referencia)</text>
    <rect x="56" y="96" width="16" height="10" rx="3" fill="none" stroke="#ffcb47" stroke-dasharray="4 3" stroke-width="2"/><text x="80" y="106">Añadido para el juego</text>
    <rect x="56" y="116" width="16" height="10" rx="3" fill="#8a87c4"/><text x="80" y="126">Pasillo / conexión</text>
  </g>
  <text x="975" y="22" text-anchor="end" font-size="11" fill="#68668f">Vista cenital esquemática · no a escala</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
