<title>Michinautas — Simulación 2.5D (papel)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--space-900:#0e0b33;--space-800:#18144e;--space-700:#241d6b;--space-600:#322a8a;--ink:#f5f5f2;--ink-muted:#c4c2e0;--ink-dark:#18144e;--line:#8a87c4;--star-gold:#ffcb47;--star-gold-deep:#c98a12;--comet-cyan:#4cc3f5;--aurora-teal:#5ad6b2;--nebula-magenta:#ee5fd6;--solar-coral:#ff7a59;--danger:#ff6b7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--space-900);font-family:Fredoka,system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;overflow:hidden;user-select:none}
.wrap{position:relative;width:min(100vw,calc(100vh*1.6));aspect-ratio:16/10}
canvas{width:100%;height:100%;display:block;border-radius:18px;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(11px,1.4vw,16px)}
.tag{position:absolute;left:2%;top:3%;background:rgba(14,11,51,.85);border:2px solid var(--line);border-radius:12px;padding:.5em .9em}
.tag b{display:block;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8em}
.tag span{font-family:"Space Mono",monospace;font-size:.72em;color:var(--ink-muted)}
.stats{position:absolute;right:2%;top:3%;display:flex;gap:.8em;background:rgba(14,11,51,.85);border:2px solid var(--line);border-radius:999px;padding:.45em 1em;font:700 .85em "Space Mono",monospace}
.stats i{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.35em;vertical-align:-.05em}
.prompt{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:var(--star-gold);color:var(--ink-dark);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:14px;padding:.6em 1.1em;box-shadow:0 5px 0 var(--star-gold-deep);transition:opacity .15s}
.prompt kbd{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;margin-right:.5em;border-radius:6px;background:var(--ink-dark);color:var(--ink);font:700 .8em "Space Mono",monospace}
.toast{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:var(--space-700);border:2px solid var(--nebula-magenta);border-radius:999px;padding:.55em 1.2em;font-weight:600;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.help{position:absolute;left:2%;bottom:4%;font-size:.75em;color:var(--ink-muted);background:rgba(14,11,51,.7);padding:.4em .8em;border-radius:999px}
</style>
</head>

const img = {}; let loaded = 0; const keysList = Object.keys(SPR);
keysList.forEach(k => { const i = new Image(); i.onload = () => { loaded++; }; i.src = SPR[k]; img[k] = i; });

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 600;
// ---------- Proyección 2.5D: piso en perspectiva ----------
const ROOM = { w: 12, d: 6 };           // unidades de mundo (x: ancho, z: profundidad; z=0 pared del fondo)
const BACK_Y = 250, FRONT_Y = 560;      // y en pantalla del borde trasero y delantero del piso
const S_BACK = 0.72, S_FRONT = 1.12;    // escala por profundidad
const UNIT = 66;                        // px por unidad en el frente
const sAt = z => S_BACK + (S_FRONT - S_BACK) * (z / ROOM.d);
const proj = (x, z) => { const s = sAt(z); return { x: W / 2 + (x - ROOM.w / 2) * UNIT * s, y: BACK_Y + (FRONT_Y - BACK_Y) * (z / ROOM.d), s }; };

// ---------- Escena ----------
const OBJS = [
  { id: 'cocina',  x: 2.2,  z: 0.7, w: 1.6, h: 1.5, label: 'Comer', color: '#ff7a59', icon: 'food' },
  { id: 'paneles', x: 9.8,  z: 0.7, w: 1.6, h: 1.5, label: 'Orientar paneles', color: '#ffcb47', icon: 'power' },
  { id: 'caja',    x: 3.4,  z: 4.4, w: 1.1, h: 0.9, label: null, color: '#9b7bff', icon: 'box' },
  { id: 'planta',  x: 10.4, z: 4.8, w: 0.9, h: 1.3, label: null, color: '#5ad6b2', icon: 'plant' },
];
const DOOR = { x: 6, z: 0, w: 1.8 };   // esclusa en la pared del fondo
const S = { energy: 80, hunger: 60, rad: 5 };
const P = { x: 6, z: 3.6, face: 1, scaleX: 1, moving: false, t: 0, helmet: false, autoHelmet: false };
const keys = new Set(); let target = null;

// ---------- Entrada ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === 'e') useNear();
  if (k === 'h') { P.helmet = !P.helmet; P.autoHelmet = false; toast(P.helmet ? 'Casco puesto' : 'Casco guardado'); }
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * W, sy = (e.clientY - r.top) / r.height * H;
  if (sy < BACK_Y) return;
  const z = (sy - BACK_Y) / (FRONT_Y - BACK_Y) * ROOM.d; const x = (sx - W / 2) / (UNIT * sAt(z)) + ROOM.w / 2;
  target = { x: clamp(x, .6, ROOM.w - .6), z: clamp(z, .9, ROOM.d - .2) };
});
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Interacción ----------
let near = null;
function useNear() {
  if (!near) return;
  if (near.id === 'cocina') { S.hunger = Math.min(100, S.hunger + 30); S.energy -= 4; toast('Comiste (−4 energía)'); }
  if (near.id === 'paneles') { S.energy = Math.min(100, S.energy + 20); S.rad = Math.min(100, S.rad + 6); toast('+20 energía · +6 radiación'); }
  if (near.id === 'door') { toast('La esclusa se abre en la misión 2'); }
  P.hop = 1;
}
const toastEl = document.getElementById('toast'); let tt = 0;
function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1800); }

// ---------- Dibujo ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const STARS = Array.from({ length: 40 }, (_, i) => ({ x: (i * 97) % 300, y: (i * 53) % 120, r: i % 7 ? 1 : 1.8 }));

function drawRoom(t) {
  // fondo
  ctx.fillStyle = '#0e0b33'; ctx.fillRect(0, 0, W, H);
  const bl = proj(0, 0), br = proj(ROOM.w, 0), fl = proj(0, ROOM.d), fr = proj(ROOM.w, ROOM.d);
  const wallH = 230 * S_BACK;
  // paredes laterales
  ctx.fillStyle = '#211a66';
  ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(bl.x, bl.y - wallH); ctx.lineTo(fl.x - 60, 0); ctx.lineTo(fl.x - 60, fl.y); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(br.x, br.y); ctx.lineTo(br.x, br.y - wallH); ctx.lineTo(fr.x + 60, 0); ctx.lineTo(fr.x + 60, fr.y); ctx.closePath(); ctx.fill();
  // pared del fondo
  ctx.fillStyle = '#2a2380'; ctx.fillRect(bl.x, bl.y - wallH, br.x - bl.x, wallH);
  ctx.fillStyle = '#322a8a'; ctx.fillRect(bl.x, bl.y - 18, br.x - bl.x, 18);
  // ventana con estrellas y la Luna (recorte de papel)
  const wx = bl.x + 40, wy = bl.y - wallH + 26, ww = 200, wh = 110;
  ctx.fillStyle = '#faf8f0'; rr(wx - 7, wy - 7, ww + 14, wh + 14, 22); ctx.fill();
  ctx.save(); rr(wx, wy, ww, wh, 16); ctx.clip();
  ctx.fillStyle = '#0e0b33'; ctx.fillRect(wx, wy, ww, wh);
  STARS.forEach(s => { ctx.fillStyle = '#c4c2e0'; ctx.beginPath(); ctx.arc(wx + (s.x + t * 4) % ww, wy + s.y % wh, s.r, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#c4c2e0'; ctx.beginPath(); ctx.arc(wx + ww - 40, wy + wh - 18, 46, 0, 7); ctx.fill();
  ctx.fillStyle = '#9a98c8'; ctx.beginPath(); ctx.arc(wx + ww - 56, wy + wh - 30, 10, 0, 7); ctx.arc(wx + ww - 24, wy + wh - 6, 13, 0, 7); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#0e0b33'; ctx.lineWidth = 4; rr(wx, wy, ww, wh, 16); ctx.stroke();
  // segunda ventana
  const w2 = br.x - 240;
  ctx.fillStyle = '#faf8f0'; rr(w2 - 7, wy - 7, 214, 124, 22); ctx.fill();
  ctx.save(); rr(w2, wy, 200, 110, 16); ctx.clip(); ctx.fillStyle = '#0e0b33'; ctx.fillRect(w2, wy, 200, 110);
  STARS.forEach(s => { ctx.fillStyle = '#c4c2e0'; ctx.beginPath(); ctx.arc(w2 + (s.x * 1.3 + t * 4) % 200, wy + (s.y * 1.7) % 110, s.r, 0, 7); ctx.fill(); });
  ctx.restore(); ctx.strokeStyle = '#0e0b33'; rr(w2, wy, 200, 110, 16); ctx.stroke();
  // puerta de la esclusa
  const d = proj(DOOR.x, 0), dw = DOOR.w * UNIT * S_BACK;
  ctx.fillStyle = '#faf8f0'; rr(d.x - dw / 2 - 7, d.y - 170 - 7, dw + 14, 184, 20); ctx.fill();
  ctx.fillStyle = '#1d1858'; rr(d.x - dw / 2, d.y - 170, dw, 170, 14); ctx.fill();
  ctx.strokeStyle = '#ffcb47'; ctx.lineWidth = 5; ctx.setLineDash([12, 9]); ctx.beginPath(); ctx.moveTo(d.x, d.y - 160); ctx.lineTo(d.x, d.y - 6); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#c4c2e0'; ctx.font = '600 13px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ESCLUSA', d.x, d.y - 178);
  // piso en perspectiva
  ctx.fillStyle = '#3a3194'; ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(fr.x + 60, H); ctx.lineTo(fl.x - 60, H); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(fr.x + 60, H); ctx.lineTo(fl.x - 60, H); ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(138,135,196,.35)'; ctx.lineWidth = 2;
  for (let x = 0; x <= ROOM.w; x++) { const a = proj(x, 0), b = proj(x, ROOM.d + 1.2); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y + 30); ctx.stroke(); }
  for (let z = 0; z <= ROOM.d + 1; z++) { const a = proj(-1, z), b = proj(ROOM.w + 1, z); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.restore();
}

function paperStandee(o) {
  const p = proj(o.x, o.z), w = o.w * UNIT * p.s, h = o.h * UNIT * p.s, x = p.x - w / 2, y = p.y - h;
  // sombra en el piso
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w * .55, 9 * p.s, 0, 0, 7); ctx.fill();
  // borde de papel
  ctx.fillStyle = '#faf8f0'; rr(x - 7 * p.s, y - 7 * p.s, w + 14 * p.s, h + 14 * p.s, 16 * p.s); ctx.fill();
  ctx.fillStyle = '#0e0b33'; rr(x, y, w, h, 12 * p.s); ctx.fill();
  if (o.icon === 'food' || o.icon === 'power') {
    ctx.fillStyle = o.color; rr(x + w * .14, y + h * .14, w * .72, h * .42, 8 * p.s); ctx.fill();
    ctx.fillStyle = '#322a8a'; rr(x + w * .14, y + h * .64, w * .72, h * .2, 6 * p.s); ctx.fill();
    if (near === o) { ctx.strokeStyle = '#ffcb47'; ctx.lineWidth = 4; rr(x - 7 * p.s, y - 7 * p.s, w + 14 * p.s, h + 14 * p.s, 16 * p.s); ctx.stroke(); }
    ctx.fillStyle = '#c4c2e0'; ctx.font = `600 ${Math.round(13 * p.s)}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(o.id === 'cocina' ? 'COCINA' : 'ENERGÍA', p.x, y - 14 * p.s);
  } else if (o.icon === 'box') {
    ctx.fillStyle = o.color; rr(x + 4, y + 4, w - 8, h - 8, 8); ctx.fill(); ctx.strokeStyle = '#0e0b33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 4, y + h / 2); ctx.lineTo(x + w - 4, y + h / 2); ctx.stroke();
  } else if (o.icon === 'plant') {
    ctx.fillStyle = '#6b4a3a'; rr(x + w * .2, y + h * .6, w * .6, h * .36, 6); ctx.fill();
    ctx.fillStyle = o.color; [[.5,.3,.3],[.3,.42,.22],[.7,.42,.22]].forEach(([a,b,c]) => { ctx.beginPath(); ctx.arc(x + w * a, y + h * b, w * c, 0, 7); ctx.fill(); });
  }
}

function drawPlayer(t) {
  const p = proj(P.x, P.z);
  const hop = (P.hop || 0); const hopY = Math.sin(hop * Math.PI) * 14 * p.s;
  // sombra (el michi de papel no la trae: la pone el piso)
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 30 * p.s * (1 - hop * .2), 8 * p.s, 0, 0, 7); ctx.fill();
  const walking = P.moving;
  const frame = walking ? (Math.floor(t * 5.5) % 2 ? 'walk1' : 'walk0') : ((t % 2.6) > 2.45 ? 'idle1' : 'idle0');
  const key = (P.helmet ? 'casco_' : 'sin_') + frame; const im = img[key]; if (!im || !im.complete) return;
  const size = 170 * p.s;                       // tamaño en pantalla del frame de 256 px
  const ax = 132 / 256 * size, ay = 223 / 256 * size;  // ancla en los pies
  ctx.save(); ctx.translate(p.x, p.y - hopY); ctx.scale(P.scaleX, 1);   // volteo de papel (escala X)
  ctx.drawImage(im, -ax, -ay, size, size);
  ctx.restore();
}

// ---------- Bucle ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  let ix = 0, iz = 0;
  if (keys.has('a') || keys.has('arrowleft')) ix--; if (keys.has('d') || keys.has('arrowright')) ix++;
  if (keys.has('w') || keys.has('arrowup')) iz--; if (keys.has('s') || keys.has('arrowdown')) iz++;
  if (ix || iz) target = null;
  if (target) { const dx = target.x - P.x, dz = target.z - P.z, d = Math.hypot(dx, dz); if (d < .08) target = null; else { ix = dx / d; iz = dz / d; } }
  const len = Math.hypot(ix, iz) || 1, sp = 3.2;
  P.x = clamp(P.x + ix / len * sp * dt, .6, ROOM.w - .6);
  P.z = clamp(P.z + iz / len * sp * dt * .8, .9, ROOM.d - .2);
  // colisión simple con los recortes del piso
  OBJS.forEach(o => { const dx = P.x - o.x, dz = P.z - o.z; const rx = o.w / 2 + .35, rz = .45; if (Math.abs(dx) < rx && Math.abs(dz) < rz) { if (rx - Math.abs(dx) < rz - Math.abs(dz)) P.x = o.x + Math.sign(dx || 1) * rx; else P.z = o.z + Math.sign(dz || 1) * rz; } });
  P.moving = ix !== 0 || iz !== 0;
  if (ix) P.face = ix > 0 ? 1 : -1;
  // volteo de papel: la escala X viaja hacia ±1 pasando por 0 (como girar una hoja)
  P.scaleX += (P.face - P.scaleX) * Math.min(1, dt * 14);
  if (P.hop) P.hop = Math.max(0, P.hop - dt * 3.5);

  // cercanía
  near = null;
  for (const o of OBJS) if (o.label && Math.hypot(P.x - o.x, P.z - o.z) < 1.5) near = o;
  if (!near && Math.abs(P.x - DOOR.x) < 1.2 && P.z < 1.6) near = { id: 'door', label: 'Abrir esclusa' };
  // casco automático junto a la esclusa
  const atDoor = Math.abs(P.x - DOOR.x) < 1.6 && P.z < 2;
  if (atDoor && !P.helmet) { P.helmet = true; P.autoHelmet = true; toast('Casco puesto: zona de esclusa'); }
  else if (!atDoor && P.autoHelmet) { P.helmet = false; P.autoHelmet = false; }
  const pr = document.getElementById('prompt'); pr.style.opacity = near ? 1 : 0; if (near) document.getElementById('pText').textContent = near.label;

  // recursos (lentos, solo para mostrar el costo de cada acción)
  S.energy = clamp(S.energy - dt * .2, 0, 100); S.hunger = clamp(S.hunger - dt * .25, 0, 100); S.rad = clamp(S.rad + dt * .02, 0, 100);
  document.getElementById('sE').textContent = Math.round(S.energy); document.getElementById('sH').textContent = Math.round(S.hunger); document.getElementById('sR').textContent = Math.round(S.rad);

  drawRoom(t);
  // orden por profundidad (z): lo de atrás primero
  const list = [...OBJS.map(o => ({ z: o.z, d: () => paperStandee(o) })), { z: P.z, d: () => drawPlayer(t) }].sort((a, b) => a.z - b.z);
  list.forEach(e => e.d());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
